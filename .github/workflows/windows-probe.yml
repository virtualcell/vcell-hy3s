name: Windows probe

# Throwaway reconnaissance for a Windows build. Delete once the answer is known.
#
# MSVC cannot build this on its own -- it has no Fortran compiler. The original
# Windows build paired Intel Fortran with MSVC, and the evidence survives in the
# tree: -DPowerStationFortran and netcdf/win32/config.h for the C layer, Intel's
# /iface flags for the F90 layer, and the uppercase __cdecl entry points in
# msgwrapper.cpp. Nothing here needs MSYS2 or Cygwin: unlike Chombo, Hy3S has no
# build system of its own, just CMake over plain Fortran.
#
# So the question is whether Intel oneAPI's ifx still does that job. Four parts,
# cheapest first, each independent so one failure does not hide the rest:
#
#   1. Does the vendored 2007 NetCDF C layer still compile under modern MSVC?
#      That needs no Fortran at all, so it is checked first and alone.
#   2. Does ifx install on a runner, and what does it cost in time?
#   3. Does ifx accept the #if directives converted from !DEC$, and does it
#      still mangle names the way msgwrapper.cpp expects?
#   4. Does CMake pair ifx with cl.exe and build the real thing?

on:
  push:
    branches: [ windows-probe ]
  workflow_dispatch:

jobs:
  # ANSWERED: the vendored 2007 NetCDF C layer compiles under modern MSVC and
  # produces netcdf.lib, with only C4293 shift warnings in ncx.c. Left here for
  # the record but disabled, so re-runs do not repeat it.
  msvc-only:
    if: false
    name: 1. NetCDF C layer under MSVC alone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure just the C library
        shell: pwsh
        run: |
          # netcdf/libsrc is the C layer. Building it alone answers whether the
          # 2007 sources survive eighteen years of MSVC, without involving
          # Fortran at all.
          @'
          cmake_minimum_required(VERSION 3.20)
          project(nc_c_only LANGUAGES C)
          if (MSVC)
            add_definitions(-DPowerStationFortran /D_CRT_SECURE_NO_WARNINGS)
            include_directories(win32)
          endif()
          include_directories(libsrc)
          add_subdirectory(libsrc)
          '@ | Set-Content netcdf/CMakeLists.probe.txt
          Copy-Item netcdf/CMakeLists.txt netcdf/CMakeLists.orig.txt
          Copy-Item netcdf/CMakeLists.probe.txt netcdf/CMakeLists.txt
          cmake -B nc-c -S netcdf -DCMAKE_BUILD_TYPE=Release 2>&1 | Select-Object -Last 20

      - name: Build it
        shell: pwsh
        continue-on-error: true
        run: |
          cmake --build nc-c --config Release 2>&1 | Select-Object -Last 40
          Write-Host "---- summary ----"
          if (Test-Path nc-c/Release/netcdf.lib) { Write-Host "  netcdf.lib BUILT" }
          elseif (Test-Path nc-c/libsrc/Release/netcdf.lib) { Write-Host "  netcdf.lib BUILT" }
          else { Write-Host "  netcdf.lib NOT built" }

  intel-fortran:
    name: 2-4. Intel Fortran (ifx) with MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ifx does not link anything itself -- on Windows it drives MSVC's
      # link.exe. Without the developer environment it fails with
      # "error #10037: could not find 'link'", which is what the first run of
      # this probe hit and what left questions 3 and 4 unanswered. CMake's
      # compiler identification links a test program too, so it reported the
      # Fortran compiler as "unknown" for the same reason.
      - name: Activate the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # fortran-lang/setup-fortran exists for exactly this and handles the
      # oneAPI install and environment. The first attempt guessed at a
      # chocolatey package name that does not exist.
      - name: Install Intel Fortran
        id: setup
        uses: fortran-lang/setup-fortran@v1
        continue-on-error: true
        with:
          compiler: intel
          version: '2025.0'

      - name: Report what the toolchain provides
        id: findifx
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "  action reported FC=${{ steps.setup.outputs.fc }}"
          $ifx = (Get-Command ifx -ErrorAction SilentlyContinue).Source
          if (-not $ifx -and "${{ steps.setup.outputs.fc }}") { $ifx = "${{ steps.setup.outputs.fc }}" }
          if ($ifx) {
            Write-Host "  ifx: $ifx"
            "ifx=$ifx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            & $ifx --version 2>&1 | Select-Object -First 3
          } else {
            Write-Host "  no Fortran compiler on PATH -- questions 3 and 4 cannot be answered"
            Write-Host "  chocolatey packages matching intel, for reference:"
            choco search intel --limit-output 2>&1 | Select-Object -First 20
          }
          # The whole point of the msvc-dev-cmd step above.
          $link = (Get-Command link -ErrorAction SilentlyContinue).Source
          if ($link) { Write-Host "  link: $link" } else { Write-Host "  link.exe STILL not on PATH" }

      # Split from the link step below on purpose. The first run could not tell
      # these apart: ifx emitted no diagnostics and then died looking for
      # link.exe, so "the directives are fine" was an inference from silence.
      - name: 3a. Does ifx's fpp accept the converted directives? (compile only)
        if: steps.findifx.outputs.ifx != ''
        shell: pwsh
        continue-on-error: true
        run: |
          # The !DEC$ IF directives were converted to #if defined(...) so the
          # sources build with gfortran. Intel's fpp should handle them too --
          # if it does not, the conversion broke the compiler this code was
          # actually written for, which would matter a great deal.
          @'
          program t
          #if defined(MILSTEIN)
            print *, "MILSTEIN branch taken"
          #else
            print *, "default branch taken"
          #endif
            print *, "version " // SVNVERSION
          end program
          '@ | Set-Content probe.f90
          & "${{ steps.findifx.outputs.ifx }}" /fpp /c /DMILSTEIN /DSVNVERSION="""abc123""" probe.f90 2>&1 |
            Select-Object -Last 10
          if (Test-Path probe.obj) { Write-Host "  COMPILED -- fpp accepted the directives" }
          else { Write-Host "  DID NOT COMPILE" }

      # The toy above proves fpp handles the syntax; this proves it handles the
      # real files. Preprocess only (/P), not compile: two of these five do
      # `USE netcdf`, so compiling them standalone would fail for a reason that
      # has nothing to do with the question being asked. Preprocessing needs no
      # modules at all, and it is the preprocessor that the conversion touched.
      - name: 3b. Run ifx's fpp over the files carrying the converted directives
        if: steps.findifx.outputs.ifx != ''
        shell: pwsh
        continue-on-error: true
        run: |
          # These five hold 112 of the 114 converted directives; the other two
          # files in the build have none.
          $srcs = @(
            'f2kcli.f90', 'dataio.f90', 'SDEintegration.f90',
            'propagators-HyJCMSS.f90', 'mainprogram-HyJCMSS.f90'
          )
          New-Item -ItemType Directory -Force -Path pp | Out-Null
          $ok = 0; $bad = @()
          foreach ($s in $srcs) {
            $out = & "${{ steps.findifx.outputs.ifx }}" /fpp /P /DMILSTEIN `
                     /DSVNVERSION="""probe""" "Hy3S/src/$s" 2>&1
            if ($LASTEXITCODE -eq 0) { $ok++; Write-Host "  ok   $s" }
            else {
              $bad += $s
              Write-Host "  FAIL $s"
              $out | Select-Object -First 12 | ForEach-Object { Write-Host "       $_" }
            }
          }
          Write-Host "---- $ok preprocessed, $($bad.Count) failed ----"
          if ($bad) { Write-Host "  failed: $($bad -join ', ')" }
          # With MILSTEIN defined and messaging undefined, the guarded messaging
          # calls should be gone and the Milstein branch kept. If the directives
          # were silently ignored the opposite would show.
          if (Test-Path SDEintegration.i) {
            $t = Get-Content SDEintegration.i -Raw
            Write-Host "  SDEintegration.i mentions send_progress: $($t -match 'send_progress')"
          }

      # 21 code lines in these sources run past 132 columns -- ratelaws.f90
      # reaches 150, in the middle of arithmetic. gfortran takes them because
      # the build passes -ffree-line-length-none; Intel has no equivalent
      # "unlimited" setting. None of the original Makefiles passed
      # /extend-source either, so the old build never settled this. If ifx
      # truncates at 132 silently, a der_anew expression could still parse and
      # compute something different, which is far worse than a hard error.
      - name: 3c. What does ifx do with a line past 132 columns?
        if: steps.findifx.outputs.ifx != ''
        shell: pwsh
        continue-on-error: true
        run: |
          # The assignment is padded so the trailing "+ 3" sits past column 132.
          # If the line is truncated there the sum becomes 3 instead of 6 --
          # which is the outcome that matters, because truncated arithmetic can
          # still parse and just compute something else. A previous version of
          # this step used 100 spaces and only reached 115 columns, so it proved
          # nothing; the assert below stops that from passing unnoticed again.
          $pad = ' ' * 150
          @"
          program t
            integer :: a
            a = 1 + 2$pad + 3
            print *, "a =", a
          end program
          "@ | Set-Content long.f90
          $cols = (Get-Content long.f90)[2].Length
          Write-Host "  line 3 is $cols columns"
          if ($cols -le 132) { Write-Host "  PROBE IS INVALID -- line does not exceed 132"; exit 1 }
          Write-Host "  expect 'a = 6' if the whole line is read, 'a = 3' if truncated at 132"
          foreach ($opt in @('', '/extend-source:132')) {
            $label = if ($opt) { $opt } else { '(no flag)' }
            Write-Host "---- $label ----"
            Remove-Item long.exe -ErrorAction SilentlyContinue
            $args = @('/fpp') + @($opt | Where-Object { $_ }) + @('long.f90', '/exe:long.exe')
            & "${{ steps.findifx.outputs.ifx }}" @args 2>&1 | Select-Object -Last 6
            if (Test-Path long.exe) { ./long.exe } else { Write-Host "  did not build" }
          }

      - name: 4. Does CMake pair ifx with cl.exe on the real sources?
        if: steps.findifx.outputs.ifx != ''
        shell: pwsh
        continue-on-error: true
        run: |
          # Ninja rather than the Visual Studio generator: the VS generator
          # needs oneAPI's IDE integration installed to see Fortran at all,
          # which setup-fortran does not provide. Ninja just runs the compilers.
          # Messaging off, so there is nothing external to resolve -- NetCDF is
          # vendored and libcurl is only needed for messaging.
          cmake -B win -S . -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_Fortran_COMPILER="${{ steps.findifx.outputs.ifx }}" `
            -DOPTION_TARGET_MESSAGING=OFF 2>&1 | Select-Object -Last 30
          Write-Host "---- building ----"
          cmake --build win 2>&1 | Select-Object -Last 60
          Write-Host "---- what came out ----"
          Get-ChildItem -Path win -Filter "Hybrid_*" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }
